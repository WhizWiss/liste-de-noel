<!doctype html>
<html lang="fr">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ma liste de Noël</title>
<meta name="description" content="Ma liste de Noël 2026 : ouvrez les cadeaux !">
<meta property="og:title" content="Ma liste de Noël">
<meta property="og:description" content="Ouvrez les cadeaux pour voir ce qu’il y a dedans.">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Figtree:wght@400;500;600;700&family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..600&family=Pinyon+Script&display=swap">
<style>
:root {
  /* Layout: a snowy night. String lights across the top, a centred greeting with the countdown,
     then a grid of wrapped presents each hanging a kraft gift tag, and a snowbank at the foot.
     Opening a present takes the item to centre stage under a spotlight. */
  --night: #0b221b;
  --night-hi: #17402f;
  --pine: #1f5a45;
  --pine-deep: #123a2c;
  --berry: #c32739;
  --berry-hi: #e2566a;
  --berry-deep: #8a1525;
  --gold: #e9bf63;
  --gold-soft: #f7e0a3;
  --gold-deep: #c4933c;
  --snow: #f8f4ec;
  --snow-shade: #c9d8d9;
  --mist: #b7cdc3;
  --kraft: #d2ab7a;
  --kraft-ring: #e3c497;
  --ink: #2e2118;
  --ink-soft: #5d4532;
  --ember: rgba(236, 148, 72, .16);
  --socket: #10291f;
  --wire: #06140f;
  --case-red: #dc1f2b;
  --case-red-dk: #a20f1a;
  --spine: #1b1a22;
  --spine-hi: #2d2a36;
  --page: #efe6d2;
  --page-line: #d6c8ab;
  --bulb-1: #ff5a52;
  --bulb-2: #ffcb5c;
  --bulb-3: #59d68f;
  --bulb-4: #7fc1ff;
  --bulb-5: #fff0c8;
  --noise: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .32 0 0 0 0 .22 0 0 0 0 .12 0 0 0 .55 0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
  --font-display: "Fraunces", Georgia, "Times New Roman", serif;
  --font-script: "Pinyon Script", "Edwardian Script ITC", "Brush Script MT", cursive;
  --font-hand: "Caveat", "Segoe Print", "Bradley Hand", cursive;
  --font-ui: "Figtree", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}

html { background: var(--night); }
body {
  margin: 0;
  min-height: 100%;
  background:
    radial-gradient(120% 60% at 50% -10%, var(--night-hi), transparent 70%),
    radial-gradient(90% 40% at 50% 105%, var(--ember), transparent 70%),
    var(--night);
  background-attachment: fixed;
  color: var(--snow);
  font-family: var(--font-ui);
  font-size: 16px;
  line-height: 1.5;
  overflow-x: hidden;
}
[hidden] { display: none !important; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

#sky, #fx { position: fixed; inset: 0; pointer-events: none; }
#sky { z-index: 0; }
#fx { z-index: 50; }

/* ---------- string lights ---------- */
.garland { position: absolute; top: env(safe-area-inset-top, 0px); left: 0; width: 100%; height: 100px; z-index: 3; pointer-events: none; overflow: visible; }
.garland .wire { fill: none; stroke: var(--wire); stroke-width: 2.2; }
.bulb { pointer-events: auto; cursor: pointer; animation: power-on .55s ease-out var(--on) both; }
.bulb .halo { fill: var(--c); opacity: .5; transform-box: fill-box; transform-origin: center; animation: twinkle var(--tw) ease-in-out var(--twd) infinite alternate; }
.bulb .glass { fill: var(--c); }
.bulb .cap { fill: var(--socket); }
.bulb .shine { fill: none; stroke: rgba(255, 255, 255, .7); stroke-width: 1.4; stroke-linecap: round; }
.bulb.flare .halo { animation: flare .7s ease-out; }
@keyframes power-on { 0% { opacity: .12; } 55% { opacity: 1; } 70% { opacity: .35; } 100% { opacity: 1; } }
@keyframes twinkle { from { opacity: .12; } to { opacity: .7; } }
@keyframes flare { 0% { opacity: 1; transform: scale(2.2); } 100% { opacity: .5; transform: scale(1); } }

/* ---------- sound toggle ---------- */
.sound {
  position: fixed; z-index: 60;
  top: calc(env(safe-area-inset-top, 0px) + 14px);
  right: calc(env(safe-area-inset-right, 0px) + 14px);
  width: 44px; height: 44px; border-radius: 50%;
  display: grid; place-items: center;
  border: 1px solid color-mix(in srgb, var(--gold) 40%, transparent);
  background: color-mix(in srgb, var(--night) 70%, transparent);
  backdrop-filter: blur(6px);
  color: var(--gold-soft);
  cursor: pointer;
}
.sound:hover { border-color: var(--gold); }
.sound:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }
.sound .slash { display: none; }
.sound.playing { box-shadow: 0 0 0 0 color-mix(in srgb, var(--gold) 50%, transparent); animation: ring 2.4s ease-out infinite; }
@keyframes ring { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--gold) 45%, transparent); } 70%, 100% { box-shadow: 0 0 0 12px transparent; } }
.music-hint {
  position: fixed; z-index: 60; margin: 0;
  top: calc(env(safe-area-inset-top, 0px) + 66px); right: calc(env(safe-area-inset-right, 0px) + 12px);
  padding: 6px 12px; border-radius: 999px; font-size: .8rem; color: var(--gold-soft);
  background: color-mix(in srgb, var(--night) 80%, transparent); border: 1px solid color-mix(in srgb, var(--gold) 35%, transparent);
  backdrop-filter: blur(6px); pointer-events: none; animation: hint-bob 2.2s ease-in-out infinite alternate;
}
@keyframes hint-bob { from { transform: translateY(0); } to { transform: translateY(4px); } }
.credits-box { margin-top: 22px; font-size: .72rem; color: color-mix(in srgb, var(--mist) 55%, transparent); }
.credits-box summary { cursor: pointer; list-style: none; letter-spacing: .06em; }
.credits-box summary::-webkit-details-marker { display: none; }
.credits-box summary:focus-visible { outline: 1px dashed var(--gold); outline-offset: 3px; }
.credits { margin: 8px auto 0; max-width: 60ch; line-height: 1.6; }
.credits a { color: inherit; }
.sound[aria-pressed="false"] { color: var(--mist); }
.sound[aria-pressed="false"] .slash { display: inline; }

/* ---------- page ---------- */
.page {
  position: relative; z-index: 2;
  max-width: 1080px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 132px 24px;
}
.hero { display: grid; justify-items: center; gap: 12px; text-align: center; }
.eyebrow { margin: 0; padding-left: .32em; font: 600 .78rem/1 var(--font-ui); letter-spacing: .32em; text-transform: uppercase; color: var(--gold); }
.title { margin: 0; display: grid; justify-items: center; line-height: 1; text-wrap: balance; }
.t-ma { font-family: var(--font-display); font-weight: 500; font-size: clamp(1.9rem, 5.5vw, 3.2rem); font-variation-settings: "opsz" 144; letter-spacing: .01em; color: var(--snow); }
.t-noel {
  appearance: none; border: 0; margin: -.1em 0 0; padding: 0 .3em .14em;
  font-family: var(--font-script); font-weight: 400; font-size: clamp(4.2rem, 17vw, 9.5rem); line-height: 1.05;
  color: transparent; cursor: pointer;
  background: linear-gradient(100deg, var(--gold) 0%, var(--gold) 38%, var(--gold-soft) 50%, var(--gold) 62%, var(--gold) 100%);
  background-size: 260% 100%;
  -webkit-background-clip: text; background-clip: text;
  filter: drop-shadow(0 4px 22px rgba(233, 191, 99, .28));
  animation: shimmer 7s ease-in-out infinite;
}
.t-noel:focus-visible { outline: 2px dashed var(--gold); outline-offset: 2px; border-radius: 14px; }
@keyframes shimmer { 0%, 100% { background-position: 100% 0; } 50% { background-position: 0 0; } }
.countdown { margin: 2px 0 0; font-family: var(--font-display); font-size: 1.15rem; color: var(--mist); }
.countdown strong { font-weight: 600; font-size: 1.6em; color: var(--snow); font-variant-numeric: lining-nums tabular-nums; margin: 0 .1em; }
.intro { max-width: 38ch; margin: 4px 0 0; font-family: var(--font-display); font-style: italic; font-size: 1.12rem; color: var(--mist); text-wrap: pretty; }

.wishes { margin-top: 76px; }
.list-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 16px; padding-bottom: 14px; margin-bottom: 44px; border-bottom: 1px solid color-mix(in srgb, var(--gold) 25%, transparent); }
.list-head h2 { margin: 0; font-family: var(--font-display); font-weight: 600; font-size: 1.7rem; }
.list-head .count { color: var(--mist); font-size: .95rem; }
.list-head .hint { margin-left: auto; color: var(--gold-soft); font-size: .9rem; }
.badge-example { padding: 4px 12px; border: 1px dashed color-mix(in srgb, var(--gold) 60%, transparent); border-radius: 999px; font-size: .78rem; font-weight: 600; letter-spacing: .03em; color: var(--gold-soft); }

/* ---------- presents ---------- */
.gifts { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 60px 32px; }
.wish { display: flex; flex-direction: column; align-items: center; cursor: pointer; animation: drop .9s cubic-bezier(.25, 1.5, .45, 1) both; animation-delay: calc(var(--i) * 90ms + 350ms); }
@keyframes drop { from { transform: translateY(-28px); } to { transform: none; } }

.gift { position: relative; width: 180px; height: 152px; padding: 0; border: 0; background: none; cursor: pointer; -webkit-tap-highlight-color: transparent; }
.gift:focus-visible { outline: 2px dashed var(--gold); outline-offset: 6px; border-radius: 12px; }
.gift-body { position: absolute; left: 50%; bottom: 0; width: var(--w); margin-left: calc(var(--w) / -2); height: calc(var(--h) + 56px); transform-origin: 50% 100%; }
.box {
  position: absolute; left: 0; right: 0; bottom: 0; height: var(--h);
  background: var(--paper); border-radius: 3px 3px 6px 6px;
  box-shadow: inset 0 -14px 22px rgba(0, 0, 0, .24), inset 0 2px 0 rgba(255, 255, 255, .08), 0 12px 18px rgba(0, 0, 0, .38);
}
.box::before, .lid::before {
  content: ""; position: absolute; top: 0; bottom: 0; left: 50%; width: 16px; margin-left: -8px;
  background: linear-gradient(90deg, rgba(0, 0, 0, .2), rgba(255, 255, 255, .25) 45%, rgba(0, 0, 0, .14)), var(--ribbon);
}
.box::after { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 9px; background: linear-gradient(rgba(0, 0, 0, .35), transparent); }
.top { position: absolute; left: -7px; right: -7px; bottom: calc(var(--h) - 6px); height: 66px; transform-origin: 50% 100%; }
.lid { position: absolute; left: 0; right: 0; bottom: 0; height: 26px; background: var(--paper); border-radius: 4px; box-shadow: 0 4px 6px rgba(0, 0, 0, .3), inset 0 -5px 9px rgba(0, 0, 0, .2), inset 0 2px 0 rgba(255, 255, 255, .12); }
.bow { position: absolute; left: 50%; bottom: 20px; width: 78px; height: 46px; margin-left: -39px; color: var(--ribbon); overflow: visible; transform-origin: 50% 85%; }
.glow, .rays { position: absolute; left: 50%; border-radius: 50%; opacity: 0; pointer-events: none; }
.glow { width: 180px; height: 180px; margin-left: -90px; bottom: calc(var(--h) - 40px); background: radial-gradient(circle, rgba(255, 236, 170, .95), rgba(255, 200, 90, .3) 40%, transparent 70%); }
.rays {
  width: 260px; height: 260px; margin-left: -130px; bottom: calc(var(--h) - 80px);
  background: repeating-conic-gradient(rgba(255, 224, 150, .5) 0 5deg, transparent 5deg 22deg);
  -webkit-mask: radial-gradient(circle, #000 18%, transparent 68%); mask: radial-gradient(circle, #000 18%, transparent 68%);
}

.p-red { --paper: radial-gradient(circle at 8px 8px, rgba(248, 244, 236, .85) 0 2.2px, transparent 2.8px) 0 0 / 16px 16px, var(--berry); --ribbon: var(--gold); }
.p-green { --paper: repeating-linear-gradient(135deg, transparent 0 11px, rgba(233, 191, 99, .55) 11px 13px, transparent 13px 24px), var(--pine); --ribbon: var(--berry); }
.p-gold { --paper: radial-gradient(circle, rgba(255, 255, 255, .25) 0 1.5px, transparent 2px) 0 0 / 12px 12px, linear-gradient(160deg, var(--gold-soft), var(--gold) 55%, var(--gold-deep)); --ribbon: var(--berry-deep); }
.p-candy { --paper: repeating-linear-gradient(-45deg, var(--snow) 0 10px, var(--berry) 10px 16px); --ribbon: var(--pine); }

@media (hover: hover) {
  .wish:hover .gift-body { animation: impatient 1.3s ease-in-out infinite; }
  .wish:hover .top { animation: peek 1.3s ease-in-out infinite; }
}
.gift:focus-visible .gift-body { animation: impatient 1.3s ease-in-out infinite; }
@keyframes impatient {
  0%, 34%, 100% { transform: none; }
  4% { transform: translateY(-4px) rotate(-4deg); }
  9% { transform: translateY(-2px) rotate(4deg); }
  14% { transform: translateY(-3px) rotate(-3deg); }
  19% { transform: rotate(2.5deg); }
  25% { transform: rotate(-1deg); }
}
@keyframes peek {
  0%, 34%, 100% { transform: none; }
  6% { transform: translateY(-7px) rotate(-3deg); }
  12% { transform: translateY(-2px); }
  18% { transform: translateY(-6px) rotate(2deg); }
  26% { transform: none; }
}

/* opening / closing: after the hover rules so they win */
.wish.opening .gift-body { animation: squash 1.15s cubic-bezier(.3, .7, .3, 1); }
.wish.opening .top { animation: lid-pop 1.15s cubic-bezier(.3, .7, .3, 1); }
.wish.opening .bow { animation: bow-boing 1.15s ease-out; }
.wish.opening .glow { animation: glow 1.15s ease-out; }
.wish.opening .rays { animation: rays 1.4s ease-out; }
.wish.closing .top { animation: lid-close .65s cubic-bezier(.3, .7, .3, 1); }
.wish.closing .gift-body { animation: settle .65s ease-out; }
@keyframes squash { 0% { transform: none; } 10% { transform: scale(1.1, .86); } 26% { transform: scale(.94, 1.08); } 42% { transform: scale(1.03, .97); } 56%, 100% { transform: none; } }
@keyframes lid-pop {
  0% { transform: none; }
  10% { transform: translateY(3px); }
  32% { transform: translateY(-76px) rotate(-14deg); }
  52% { transform: translateY(-84px) rotate(9deg); }
  76% { transform: none; }
  84% { transform: translateY(-9px) rotate(-2deg); }
  92%, 100% { transform: none; }
}
@keyframes lid-close { 0% { transform: translateY(-46px) rotate(-8deg); } 55% { transform: translateY(2px); } 75% { transform: translateY(-6px) rotate(1deg); } 100% { transform: none; } }
@keyframes settle { 0%, 45% { transform: none; } 60% { transform: scale(1.06, .92); } 80% { transform: scale(.98, 1.03); } 100% { transform: none; } }
@keyframes bow-boing { 0%, 12% { transform: none; } 34% { transform: scale(1.3) rotate(-16deg); } 52% { transform: scale(.92) rotate(10deg); } 70% { transform: scale(1.06) rotate(-4deg); } 100% { transform: none; } }
@keyframes glow { 0%, 12% { opacity: 0; transform: scale(.4); } 34% { opacity: 1; transform: scale(1); } 70% { opacity: .7; } 100% { opacity: 0; transform: scale(1.1); } }
@keyframes rays { 0%, 14% { opacity: 0; transform: scale(.5) rotate(0); } 34% { opacity: .9; } 100% { opacity: 0; transform: scale(1.2) rotate(50deg); } }

/* ---------- kraft tags ---------- */
.twine { position: relative; z-index: 2; display: block; width: 26px; height: 34px; overflow: visible; }
.twine path { fill: none; stroke-width: 2.2; stroke-linecap: round; }
.twine .t1 { stroke: var(--snow); }
.twine .t2 { stroke: var(--berry); stroke-dasharray: 2.6 2.6; }
.tag-wrap {
  position: relative; margin-top: -16px; width: min(100%, 250px);
  transform: rotate(var(--tilt)); transform-origin: 50% 16px;
  filter: drop-shadow(0 10px 14px rgba(0, 0, 0, .45));
  animation: idle var(--idle) ease-in-out var(--idle-d) infinite alternate;
}
@keyframes idle { from { transform: rotate(calc(var(--tilt) - .8deg)); } to { transform: rotate(calc(var(--tilt) + .8deg)); } }
.wish.opening .tag-wrap { animation: tag-swing 1.8s ease-out; }
@keyframes tag-swing {
  0% { transform: rotate(var(--tilt)); }
  18% { transform: rotate(calc(var(--tilt) + 7deg)); }
  40% { transform: rotate(calc(var(--tilt) - 5deg)); }
  62% { transform: rotate(calc(var(--tilt) + 2.5deg)); }
  82% { transform: rotate(calc(var(--tilt) - 1deg)); }
  100% { transform: rotate(calc(var(--tilt) - .8deg)); }
}
.tag {
  position: relative; padding: 38px 20px 22px; background: var(--kraft); color: var(--ink);
  clip-path: polygon(34px 0, calc(100% - 34px) 0, 100% 30px, 100% 100%, 0 100%, 0 30px);
  -webkit-mask: radial-gradient(circle 6px at 50% 16px, transparent 97%, #000 100%);
  mask: radial-gradient(circle 6px at 50% 16px, transparent 97%, #000 100%);
}
.tag::before { content: ""; position: absolute; left: 50%; top: 16px; width: 26px; height: 26px; margin: -13px 0 0 -13px; border-radius: 50%; background: var(--kraft-ring); box-shadow: inset 0 1px 2px rgba(0, 0, 0, .2); }
.tag::after { content: ""; position: absolute; inset: 0; background-image: var(--noise); opacity: .5; mix-blend-mode: multiply; pointer-events: none; }
.tag-name { margin: 0; font-family: var(--font-hand); font-weight: 700; font-size: 1.95rem; line-height: 1.02; text-align: center; text-wrap: balance; }
.tag-note { margin: 8px 0 0; font-family: var(--font-display); font-style: italic; font-size: .95rem; line-height: 1.4; color: var(--ink-soft); text-align: center; text-wrap: pretty; }
.tag-meta { position: relative; z-index: 1; margin-top: 14px; display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 8px 10px; }
.tag-meta:empty { display: none; }
.price { padding: 2px 9px; border: 1.5px dashed color-mix(in srgb, var(--ink) 45%, transparent); border-radius: 4px; font-weight: 600; font-size: .85rem; font-variant-numeric: tabular-nums; color: var(--ink); white-space: nowrap; }
.seal {
  position: absolute; z-index: 3; top: 10px; right: -8px; width: 36px; height: 36px; border-radius: 50%;
  display: grid; place-items: center; transform: rotate(-12deg);
  background: radial-gradient(circle at 35% 30%, var(--berry-hi), var(--berry) 45%, var(--berry-deep));
  box-shadow: 0 2px 3px rgba(0, 0, 0, .35), inset 0 0 0 3px rgba(0, 0, 0, .14);
}
.seal svg { width: 17px; height: 17px; }

/* ---------- footer ---------- */
.sign { margin-top: 100px; display: grid; justify-items: center; gap: 4px; text-align: center; }
.merci { margin: 0; font-family: var(--font-script); font-size: clamp(2.6rem, 9vw, 4.2rem); line-height: 1.15; color: var(--gold); padding: 0 .2em; }
.signature { margin: 0; font-family: var(--font-display); font-style: italic; font-size: 1.1rem; color: var(--mist); }
.snowbank { position: relative; z-index: 2; display: block; width: 100%; height: 120px; margin-top: 24px; }
.bank-back { fill: var(--snow-shade); }
.bank-front { fill: var(--snow); }

/* ---------- centre-stage reveal ---------- */
.reveal {
  position: fixed; inset: 0; width: 100%; height: 100%; max-width: none; max-height: none;
  margin: 0; padding: 0; border: 0; background: transparent; color: var(--snow);
  overflow-x: hidden; overflow-y: auto; scrollbar-width: none;
}
.reveal::-webkit-scrollbar { display: none; }
.reveal[open] { display: grid; grid-template-rows: minmax(300px, 1fr) auto; }
.reveal::backdrop { background: radial-gradient(circle at 50% 38%, rgba(31, 90, 69, .6), rgba(3, 11, 9, .95) 72%); backdrop-filter: blur(5px); animation: fade .45s ease-out; }
@keyframes fade { from { opacity: 0; } }
.rv-stage {
  position: relative; display: grid; place-items: center; min-height: 300px;
  padding-top: calc(env(safe-area-inset-top, 0px) + 28px);
  touch-action: none; cursor: grab; user-select: none; -webkit-user-select: none;
}
.rv-stage.dragging { cursor: grabbing; }
.rv-rays, .rv-glow { position: absolute; left: 50%; top: 52%; border-radius: 50%; pointer-events: none; translate: -50% -50%; }
.rv-rays {
  width: min(820px, 100vw); aspect-ratio: 1;
  background: repeating-conic-gradient(rgba(255, 224, 150, .15) 0 6deg, transparent 6deg 20deg);
  -webkit-mask: radial-gradient(circle, #000 8%, transparent 62%); mask: radial-gradient(circle, #000 8%, transparent 62%);
  animation: spin 45s linear infinite;
}
.rv-glow { width: min(460px, 100vw); aspect-ratio: 1; background: radial-gradient(circle, rgba(255, 226, 160, .4), rgba(255, 200, 90, .1) 45%, transparent 70%); animation: pulse 3.2s ease-in-out infinite alternate; }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes pulse { from { opacity: .6; scale: .94; } to { opacity: 1; scale: 1.05; } }
.rv-fly { position: relative; display: grid; justify-items: center; }
.rv-float { animation: bob 3.4s ease-in-out infinite alternate; }
@keyframes bob { from { transform: translateY(-9px); } to { transform: translateY(9px); } }
.rv-shadow { width: 64%; max-width: 320px; height: 20px; margin-top: 22px; border-radius: 50%; background: radial-gradient(closest-side, rgba(0, 0, 0, .6), transparent); animation: shadow 3.4s ease-in-out infinite alternate; }
@keyframes shadow { from { transform: scale(.82); opacity: .55; } to { transform: scale(1.04); opacity: .9; } }
.rv-item { position: relative; transform-style: preserve-3d; will-change: transform; }

/* boxes: game case and book */
.f { position: absolute; left: 50%; top: 50%; backface-visibility: hidden; -webkit-backface-visibility: hidden; }
.f-front, .f-back { background-size: 100% 100%; border-radius: 3px; }
.f-front::after { content: ""; position: absolute; inset: 0; border-radius: inherit; mix-blend-mode: screen; background: linear-gradient(105deg, transparent calc(var(--sh, 50%) - 16%), rgba(255, 255, 255, .34) var(--sh, 50%), transparent calc(var(--sh, 50%) + 16%)); }
.f-back { filter: brightness(.3) saturate(.5); }

@keyframes swap { 0% { transform: scale(1); } 35% { transform: scale(.9) rotate(-3deg); } 100% { transform: none; } }

<script>document.write('<script src="items.js?t=' + Date.now() + '"><\/script>');</script>
<script>
(() => {
  const L = window.LISTE || { envies: [] };
  const wishes = (L.envies || []).filter(w => w && w.nom);
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const css = getComputedStyle(document.documentElement);
  const tok = n => css.getPropertyValue(n).trim();
  const $ = id => document.getElementById(id);

  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const safeUrl = u => { try { const x = new URL(u); return /^https?:$/.test(x.protocol) ? x.href : ""; } catch { return ""; } };
  const safePath = p => (typeof p === "string" && /^[\w\-./]+$/.test(p) && !p.includes("..")) ? p : "";
  const host = u => { try { return new URL(u).hostname.replace(/^www\./, ""); } catch { return ""; } };
  const linksOf = w => (Array.isArray(w.liens) ? w.liens : w.lien ? [w.lien] : []).map(l => typeof l === "string" ? { url: safeUrl(l), label: "" } : { url: safeUrl(l && l.url), label: (l && l.label) || "" }).filter(l => l.url);
  const storeName = u => { const h = host(u).split(".")[0]; return h.charAt(0).toUpperCase() + h.slice(1); };

  /* preload photos so a gift opens instantly */
  wishes.forEach(w => {
    const p = safePath(w.photo); if (p) { w._img = new Image(); w._img.src = p; }
    [...(w.photos || []).map(x => x.src), ...(w.couleurs || []).map(x => x.photo)].forEach(src => { const q = safePath(src); if (q) new Image().src = q; });
  });

  /* ---------- text ---------- */
  const year = L.annee || new Date().getFullYear();
  $("eyebrow").textContent = `Noël ${year}`;
  $("intro").textContent = L.intro || "";
  $("count").textContent = `${wishes.length} envie${wishes.length > 1 ? "s" : ""}`;
  $("badge").hidden = !L.exemple;
  if ((L.ambiance || []).length) {
    $("credits").innerHTML = `Musique d’ambiance : ${L.ambiance.map(a => `<a href="${esc(safeUrl(a.lien))}" target="_blank" rel="noopener noreferrer">« ${esc(a.titre)} »</a>`).join(" et ")}, PulseBox, <a href="https://creativecommons.org/licenses/by-nd/4.0/deed.fr" target="_blank" rel="noopener noreferrer">CC BY-ND 4.0</a>. Morceaux des cadeaux : Alex Morgan et Kevin MacLeod (incompetech.com), CC BY 4.0.`;
  }
  if (L.signature) { $("signature").hidden = false; $("signature").textContent = `Gros bisous, ${L.signature}`; }

  (function countdown() {
    const now = new Date();
    const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    const days = Math.round((new Date(now.getFullYear(), 11, 25) - today) / 864e5);
    $("countdown").innerHTML =
      days > 1 ? `Plus que <strong>${days}</strong> jours avant Noël`
      : days === 1 ? `Noël, c’est <strong>demain</strong> !`
      : days === 0 ? `<strong>Joyeux Noël !</strong>`
      : `Joyeux Noël, et à l’année prochaine !`;
  })();

  /* ---------- presents ---------- */
  const PAPERS = ["p-red", "p-green", "p-gold", "p-candy"];
  const SIZES = [[120, 84], [136, 70], [104, 96], [128, 78], [112, 90]];
  const TILTS = [-2.5, 1.8, -1.2, 2.4, -1.8, 1.2];
  const BOW = `<svg class="bow" viewBox="0 0 78 46" aria-hidden="true">
      <path fill="currentColor" d="M39,35 C31,22 9,6 6,19 C3,31 25,37 39,37 Z"/>
      <path fill="currentColor" d="M39,35 C47,22 69,6 72,19 C75,31 53,37 39,37 Z"/>
      <path fill="rgba(0,0,0,.26)" d="M39,35 C32,27 16,17 13,22 C11,28 27,34 39,36 Z"/>
      <path fill="rgba(0,0,0,.26)" d="M39,35 C46,27 62,17 65,22 C67,28 51,34 39,36 Z"/>
      <path fill="none" stroke="rgba(255,255,255,.35)" stroke-width="1.4" stroke-linecap="round" d="M10,17 C14,11 22,13 30,22 M68,17 C64,11 56,13 48,22"/>
      <rect x="33.5" y="29" width="11" height="11" rx="3.5" fill="currentColor" stroke="rgba(0,0,0,.25)" stroke-width="1"/>
    </svg>`;
  const HEART = `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z" fill="rgba(0,0,0,.28)" stroke="rgba(255,255,255,.4)" stroke-width="1.3"/></svg>`;
  const ARROW = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17L17 7M9 7h8v8"/></svg>`;

  $("gifts").innerHTML = wishes.map((w, i) => {
    const [bw, bh] = SIZES[i % SIZES.length];
    const off = w.musiqueOfficielle && safeUrl(w.musiqueOfficielle.url);
    const giftInner = `<span class="rays"></span><span class="glow"></span>
        <span class="gift-body"><span class="box"></span><span class="top"><span class="lid"></span>${BOW}</span></span>`;
    const card = `${off ? `<span class="gift">${giftInner}</span>` : `<button class="gift" type="button" aria-label="Ouvrir le cadeau : ${esc(w.nom)}">${giftInner}</button>`}
      <svg class="twine" viewBox="0 0 26 34" aria-hidden="true"><path class="t1" d="M13,0 C7,9 19,18 13,34"/><path class="t2" d="M13,0 C7,9 19,18 13,34"/></svg>
      <div class="tag-wrap">
        ${w.coeur ? `<span class="seal" title="Coup de cœur">${HEART}<span class="sr">Coup de cœur</span></span>` : ""}
        <div class="tag">
          <h3 class="tag-name">${esc(w.nom)}</h3>
          ${w.note ? `<p class="tag-note">${esc(w.note)}</p>` : ""}
          <div class="tag-meta">${w.prix ? `<span class="price">${esc(w.prix)}</span>` : ""}</div>
          ${off ? `<p class="tag-music">♪ La musique officielle s’ouvre avec le cadeau</p>` : ""}
        </div>
      </div>`;
    return `<li class="wish ${PAPERS[i % PAPERS.length]}" data-i="${i}"
        style="--i:${i};--w:${bw}px;--h:${bh}px;--tilt:${TILTS[i % TILTS.length]}deg;--idle:${(5 + (i % 3) * 1.3).toFixed(1)}s;--idle-d:${(-i * .7).toFixed(1)}s">
      ${off ? `<a class="wish-link" href="${esc(off)}" target="_blank" rel="noopener noreferrer" aria-label="Ouvrir le cadeau : ${esc(w.nom)} (la musique officielle s’ouvre dans un nouvel onglet)">${card}</a>` : card}
    </li>`;
  }).join("");

  /* ---------- sound (soft synthesized bells) ---------- */
  let soundOn = true;
  try { soundOn = localStorage.getItem("noel-son") !== "off"; } catch {}
  let actx = null;
  const audio = () => {
    if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch { return null; } }
    if (actx.state === "suspended") actx.resume();
    return actx;
  };
  function bell(freq, when = 0, vol = 1) {
    if (!soundOn) return;
    const c = audio(); if (!c) return;
    const t0 = c.currentTime + when + .01;
    const out = c.createGain(); out.gain.value = .11 * vol; out.connect(c.destination);
    [[1, 1, 1.5], [2.01, .45, .9], [2.76, .28, .6], [4.07, .15, .35], [5.4, .07, .2]].forEach(([m, g, d]) => {
      const o = c.createOscillator(), e = c.createGain();
      o.type = "sine"; o.frequency.value = freq * m;
      e.gain.setValueAtTime(0, t0); e.gain.linearRampToValueAtTime(g, t0 + .006); e.gain.exponentialRampToValueAtTime(.0001, t0 + d);
      o.connect(e).connect(out); o.start(t0); o.stop(t0 + d + .05);
    });
  }

  }
  const musicOf = w => (w && w.musique && safePath(w.musique.fichier)) ? w.musique : null;
  const officialOf = w => (w && w.musiqueOfficielle && safeUrl(w.musiqueOfficielle.url)) || "";
  function syncTrack() {
    const mus = musicOf(rvWish), el = $("rv-track");
    el.hidden = !mus;
    if (!mus) return;
    el.classList.toggle("playing", soundOn);
    $("rv-track-name").innerHTML = soundOn ? esc(mus.titre) : `${esc(mus.titre)} <span class="muted">· son coupé</span>`;
  }

  function rvLoop(t) {
    if (!rvOpen) return;
    const dt = Math.min(.05, (t - rot.lt) / 1000) || .016; rot.lt = t;
    const secs = (t - rvT0) / 1000;
    if (!rot.drag) {
      rot.y += rot.vy * dt;
      rot.vy *= Math.exp(-2.2 * dt);
      if (Math.abs(rot.vy) < 45) {
        const base = Math.round(rot.y / 360) * 360, sway = 24 * Math.sin(secs * .9);
        rot.y += (base + sway - rot.y) * (1 - Math.exp(-2.4 * dt));
      }
    }
    const tx = -rot.py * 14 + 5 * Math.sin(secs * .7);
    rot.x += (tx - rot.x) * (1 - Math.exp(-4 * dt));
    rvItem.style.transform = `perspective(1100px) rotateX(${rot.x.toFixed(2)}deg) rotateY(${rot.y.toFixed(2)}deg)`;
    const m = ((rot.y % 360) + 540) % 360 - 180;
    rvItem.style.setProperty("--sh", `${(50 - m * 1.5).toFixed(1)}%`);
    if (rvWish && rvWish.couleurs && !rvClosing && t > colourHold && t - colourT > 2600 && secs > 2) { colourT = t; setColour(colourIdx + 1, true); }
    if (t - sparkleT > 700 && !rvClosing) {
      sparkleT = t;
      const r = rvItem.getBoundingClientRect();
      if (r.width) for (let k = 0; k < 2; k++) twinkle(r.left - 20 + Math.random() * (r.width + 40), r.top - 10 + Math.random() * r.height * .8);
    }
    rvRaf = requestAnimationFrame(rvLoop);
  }

  let closeDone = null;
  function openReveal(li) {
    if (rvOpen) { if (rvClosing && closeDone) closeDone(); else return; }
    const w = wishes[+li.dataset.i], links = linksOf(w), mus = musicOf(w), off = officialOf(w);
    rvLi = li; rvWish = w; rvOpen = true; rvClosing = false; colourIdx = 0; colourHold = 0;
    $("rv-name").textContent = w.nom;
    $("rv-note").textContent = w.note || "";
    $("rv-note").hidden = !w.note;
    rvLinks.innerHTML = links.map(l =>
      `<a class="tk" href="${esc(l.url)}" target="_blank" rel="noopener noreferrer"><span class="tk-k">Ticket pour</span><span class="tk-v">${esc(l.label || storeName(l.url))} ${ARROW}</span><span class="tk-stamp" aria-hidden="true">C’est parti !</span></a>`
    ).join("");
    syncTrack();
    const offEl = $("rv-official");
    offEl.hidden = !off;
    if (off) { offEl.href = off; $("rv-official-name").textContent = `${w.musiqueOfficielle.label || "Musique officielle"} · ouverte dans un nouvel onglet`; }
    const credits = [];
    if (mus) {
      const lic = LIC[mus.licence];
      credits.push(`<span id="rv-cm">Musique : ${mus.lien ? `<a href="${esc(safeUrl(mus.lien))}" target="_blank" rel="noopener noreferrer">« ${esc(mus.titre)} »</a>` : `« ${esc(mus.titre)} »`}, ${esc(mus.artiste || "")}, ${lic ? `<a href="${lic}" target="_blank" rel="noopener noreferrer">${esc(mus.licence)}</a>` : esc(mus.licence || "")}</span>`);
    }
    if (w.credit && w.credit.texte) {
      const cl = safeUrl(w.credit.lien);
      credits.push(cl ? `<a href="${esc(cl)}" target="_blank" rel="noopener noreferrer">${esc(w.credit.texte)}</a>` : esc(w.credit.texte));
    }
    $("rv-credit").innerHTML = credits.join("<br>");
    $("rv-credit").hidden = !credits.length;
    const hasColours = !!(w.couleurs && w.couleurs.length);
    $("rv-colours").hidden = !hasColours;
    if (hasColours) $("rv-dots").innerHTML = w.couleurs.map((c, k) =>
      `<button type="button" data-k="${k}" style="--dot:${esc(c.pastille || "#888")}" aria-label="${esc(c.nom || "couleur " + (k + 1))}" aria-pressed="${k === 0}"></button>`).join("");
    rv.classList.remove("show-info");
    rv.prepend(fx);
    rv.showModal();
    rv.scrollTop = 0; rv.scrollLeft = 0;
    buildItem(w);
    if (hasColours) setColour(0, false);
    openGift(li);
    Player.pauseAmbient();
    if (mus) { Player.giftPrime(safePath(mus.fichier), safePath(mus.officielle)); setTimeout(() => rvOpen && !rvClosing && Player.giftFadeIn(), 300); }
    Object.assign(rot, { x: 0, y: reduce ? 0 : -300, vy: reduce ? 0 : 1100, drag: false, py: 0 });
    rot.lt = rvT0 = colourT = performance.now();
    rvRaf = requestAnimationFrame(rvLoop);
    if (reduce) { rv.classList.add("show-info"); Player.giftFadeIn(); return; }
    const [dx, dy] = flyVector(li);
    rvFly.animate([
      { transform: `translate(${dx}px, ${dy}px) scale(.12)`, opacity: 0 },
      { opacity: 1, offset: .18 },
      { transform: "translate(0, -34px) scale(1.08)", offset: .72 },
      { transform: "none", opacity: 1 }
    ], { duration: 980, delay: 260, easing: "cubic-bezier(.2,.75,.25,1)", fill: "backwards" });
    setTimeout(() => {
      if (!rvOpen || rvClosing) return;
      const r = rvFly.getBoundingClientRect();
      burst(r.left + r.width / 2, r.top + r.height / 2, { n: 40, stars: 24, up: .95, spread: 2 });
      revealChime();
    }, 1080);
    setTimeout(() => rvOpen && rv.classList.add("show-info"), 900);
  }

  function closeReveal() {
    if (!rvOpen || rvClosing) return;
    rvClosing = true;
    Player.giftStop();
    const li = rvLi;
    const done = () => {
      if (!rvOpen || !rvClosing) return;
      closeDone = null;
      rvOpen = false; rvClosing = false;
      cancelAnimationFrame(rvRaf);
      rv.close();
      document.body.appendChild(fx);
      setTimeout(() => Player.startAmbient(), 250);
      if (li) {
        li.classList.remove("opening", "closing"); void li.offsetWidth; li.classList.add("closing");
        setTimeout(() => li.classList.remove("closing"), 700);
        bell(SCALE[0], .05, .6);
      }
    };
    if (reduce || !li) return done();
    rv.classList.remove("show-info");
    rot.vy = -1000;
    const [dx, dy] = flyVector(li);
    rvFly.animate([
      { transform: "none", opacity: 1 },
      { transform: "translate(0, -40px) scale(1.05)", opacity: 1, offset: .25 },
      { transform: `translate(${dx}px, ${dy}px) scale(.1)`, opacity: 0 }
    ], { duration: 620, easing: "cubic-bezier(.45,0,.7,.2)" }).onfinish = done;
    closeDone = done;
    setTimeout(done, 900);
  }

  rv.addEventListener("cancel", e => { e.preventDefault(); closeReveal(); });
  $("rv-close").addEventListener("click", closeReveal);
  $("rv-dots").addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b) return;
    colourHold = performance.now() + 7000;
    setColour(+b.dataset.k, true);
    bell(SCALE[3 + (+b.dataset.k % 4)], 0, .5);
  });

  stage.addEventListener("pointerdown", e => {
    rot.drag = true; rot.lx = e.clientX; rot.moved = 0; rot.vy = 0;
    stage.classList.add("dragging");
    try { stage.setPointerCapture(e.pointerId); } catch {}
  });
  stage.addEventListener("pointermove", e => {
    const r = stage.getBoundingClientRect();
    rot.py = Math.max(-1, Math.min(1, (e.clientY - (r.top + r.height / 2)) / (r.height / 2)));
    if (!rot.drag) return;
    const dx = e.clientX - rot.lx; rot.lx = e.clientX; rot.moved += Math.abs(dx);
    rot.y += dx * .6;
    rot.vy = rot.vy * .4 + (dx * .6 / .016) * .6;
  });
  const endDrag = () => {
    if (!rot.drag) return;
    rot.drag = false; stage.classList.remove("dragging");
    if (rot.moved < 5 && !reduce) { rot.vy = 900; bell(SCALE[4], 0, .6); }
  };
  stage.addEventListener("pointerup", endDrag);
  stage.addEventListener("pointercancel", endDrag);
  stage.addEventListener("pointerleave", () => { rot.py = 0; });

  rvLinks.addEventListener("click", e => {
    const tk = e.target.closest(".tk"); if (!tk) return;
    tk.classList.remove("punched"); void tk.offsetWidth; tk.classList.add("punched");
    setTimeout(() => tk.classList.remove("punched"), 1800);
    [5, 6].forEach((k, j) => bell(SCALE[k], j * .09, .8));
    const r = tk.getBoundingClientRect();
    burst(r.left + r.width / 2, r.top + r.height / 2, { n: 26, stars: 12, up: .7, spread: 2 });
  });

  /* a click on a gift opens it here; for gifts with official music the card is a real
     link, so the browser opens that music in a new tab at the same moment */
  $("gifts").addEventListener("click", e => {
    const li = e.target.closest(".wish"); if (!li) return;
    openReveal(li);
  });

  /* ---------- snow flurry on the title ---------- */
  $("noel").addEventListener("click", () => {
    if (!reduce) for (let k = 0; k < 160; k++) flakes.push(makeFlake(false, true));
    [6, 5, 4, 3, 2, 1, 0].forEach((k, j) => bell(SCALE[k], j * .07, .55));
  });

  let rt;
  addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(resize, 150); });
  resize();
  if (!reduce) requestAnimationFrame(loop);
})();
</script>

</html>
